name: 🚀 Déploiement automatique vers LWS

on:
  push:
    branches:
      - main
  workflow_dispatch: # Permet de déclencher le déploiement manuellement depuis GitHub

jobs:
  deploy:
    name: Build & Deploy via FTP
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Récupération du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Nécessaire pour que le comparateur FTP détecte les fichiers modifiés

      - name: 🐘 Configuration de PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, json, libxml
          coverage: none

      - name: 📦 Installation des dépendances Composer (Production)
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: 🟢 Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🎨 Compilation des assets Vite (CSS & JS)
        run: |
          npm install --include=optional
          npm run build
          rm -f public/hot

      - name: 🚀 Déploiement FTP vers LWS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env*
            storage/logs/**
            storage/framework/sessions/**
            storage/framework/cache/**
            storage/app/**
            public/storage/**
            tests/**
            .agent/**
            README.md